name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit, Compose UI, Fuzzing & Coverage Suite
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport -Pcoverage --stacktrace

      - name: Run Android Lint Static Analysis
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug & R8 Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooglebookAppRestorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
